name: bats

on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'cli/**'
      - 'tests/**'
      - 'schema/**'
      - 'examples/canonical-skills/**'
      - '.github/workflows/bats.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'cli/**'
      - 'tests/**'
      - 'schema/**'
      - 'examples/canonical-skills/**'

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (yq jq bats-core)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq bats
          # yq from binary (apt yq is the wrong yq)
          sudo wget -q -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Run unit tests
        run: bats tests/unit/
      - name: Run e2e tests
        run: bats tests/e2e/
