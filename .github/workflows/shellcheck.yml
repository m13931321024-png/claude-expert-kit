name: shellcheck

on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'cli/**'
      - 'examples/hooks/**'
      - '*.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'cli/**'
      - 'examples/hooks/**'
      - '*.sh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          # Soft fail: warn but don't block (V3 quality gate is advisory)
          shellcheck \
            --severity=warning \
            --shell=bash \
            --exclude=SC1091,SC2034,SC2154 \
            bin/skillctl \
            cli/cmd/*.sh \
            cli/lib/*.sh \
            examples/hooks/*.sh \
            install.sh uninstall.sh doctor.sh \
            || echo "::warning::shellcheck found issues (advisory)"
      - name: bash syntax check
        run: |
          # Hard fail: syntax errors block CI
          for f in bin/skillctl cli/cmd/*.sh cli/lib/*.sh examples/hooks/*.sh install.sh uninstall.sh doctor.sh; do
            bash -n "$f" || exit 1
          done
